# Изолированный прогон проверок: сеть без выхода наружу, порты не публикуются.
# Зависимости и тесты собираются при сборке образа check, а запускаются офлайн. Зависимости — отдельный слой с
# ключом по Cargo.toml и Cargo.lock (cargo-chef): правка исходников и другие рабочие копии на хосте берут его из кэша.
#   docker compose -f docker/docker-compose.test.yml up --build --exit-code-from check
#   docker compose -f docker/docker-compose.test.yml --profile privileged run --rm --build check-privileges
#   docker compose -f docker/docker-compose.test.yml down -v
# check-privileges — проверки, которым нужны права контейнера: понижение прав агента.
name: iapetus-test

x-check-build: &check-build
  context: ..
  dockerfile_inline: |
    # cargo-chef точной версии: рецепт сборки зависимостей из Cargo.toml и Cargo.lock без исходников. Сборка падает,
    # если sha256 архива не совпал с записанным: хеши взяты из релиза v$${CARGO_CHEF_VERSION} на GitHub. Этапы
    # cargo-chef, chef и planner одинаковы в orbit/Dockerfile, waldo/Dockerfile и
    # образе check в docker/docker-compose.test.yml: одинаковые инструкции дают общие слои кэша на хосте.
    FROM debian:trixie-slim AS cargo-chef
    ARG CARGO_CHEF_VERSION=0.1.78
    ARG CARGO_CHEF_SHA256_AMD64=aca691abfbfbbe00d482e0ed2249eec3091b65e96a0ce92947fb5b254d48b16d
    ARG CARGO_CHEF_SHA256_ARM64=cd59b90fce5fa84c4189648fec33404ec5491791eebdb812df5e7fca8336408d
    ARG TARGETARCH
    RUN apt-get update \
        && apt-get install -y --no-install-recommends ca-certificates curl xz-utils \
        && rm -rf /var/lib/apt/lists/*
    RUN case "$$TARGETARCH" in \
            amd64) triple=x86_64; sha256=$$CARGO_CHEF_SHA256_AMD64 ;; \
            arm64) triple=aarch64; sha256=$$CARGO_CHEF_SHA256_ARM64 ;; \
            *) echo "архитектура $$TARGETARCH не поддержана" >&2; exit 1 ;; \
        esac \
        && curl -fsSL -o /cargo-chef.tar.xz \
            "https://github.com/LukeMathWalker/cargo-chef/releases/download/v$${CARGO_CHEF_VERSION}/cargo-chef-$${triple}-unknown-linux-musl.tar.xz" \
        && echo "$$sha256  /cargo-chef.tar.xz" | sha256sum -c - \
        && tar -xJf /cargo-chef.tar.xz -C / --strip-components=1 "cargo-chef-$${triple}-unknown-linux-musl/cargo-chef"

    FROM rust:1.98-slim-trixie AS chef
    COPY --from=cargo-chef /cargo-chef /usr/local/cargo/bin/cargo-chef
    WORKDIR /src

    FROM chef AS planner
    COPY . .
    RUN cargo chef prepare --recipe-path /recipe.json

    # Образ check: тесты запускаются из образа офлайн, поэтому бинари тестов и исходники зависимостей лежат в
    # слоях, а не в cache mount. Без инкрементальной компиляции и без отладочной информации слои меньше в разы, а
    # их упаковка при экспорте образа занимала больше времени, чем компиляция. Место паники в сообщении теста
    # остаётся: его вшивает компилятор, а не отладочная информация.
    FROM chef
    RUN apt-get update \
        && apt-get install -y --no-install-recommends git \
        && rm -rf /var/lib/apt/lists/*
    ENV CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0
    COPY --from=planner /recipe.json /recipe.json
    RUN cargo chef cook --tests --locked --recipe-path /recipe.json
    COPY . .
    RUN cargo test --workspace --locked --no-run
    # Медленные и случайные тесты включаются только в полном прогоне: голый `cargo test` их пропускает. Падение в
    # одном пакете не останавливает остальные: один прогон показывает все красные тесты.
    ENV RUN_SLOW_TESTS=1
    CMD ["cargo", "test", "--workspace", "--locked", "--offline", "--no-fail-fast"]

networks:
  default:
    internal: true

services:
  check:
    image: ${COMPOSE_PROJECT_NAME}-check
    build: *check-build

  # Тесты понижения прав агента (orbit/tests/drop_exec) идут от root с `CAP_SYS_ADMIN`: без него убирать из bounding
  # set нечего. Остальным проверкам эти права не нужны, а с ними не работает проверка лимита inotify в waldo.
  # Образ — тот, что собрал `up --build` для check: своя сборка повторила бы ту же работу, а после правки кода между
  # двумя командами проверяла бы уже другой код.
  check-privileges:
    profiles: ["privileged"]
    image: ${COMPOSE_PROJECT_NAME}-check
    pull_policy: never
    # --workspace, а не -p orbit: с одним пакетом cargo выбирает другие features зависимостей и пересобирает их,
    # а с --workspace берёт бинарь теста, собранный в образе.
    command: ["cargo", "test", "--workspace", "--locked", "--offline", "--test", "drop_exec"]
    cap_add:
      - SYS_ADMIN
